<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Web Designer Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .portfolio-card { height: 400px; transition: all 0.3s ease; }
    </style>
</head>
<body class="bg-[#fafafa] text-gray-900 min-h-screen">

    <header class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-tight">MY PORTFOLIO</h1>
            <button onclick="clearData()" class="text-xs text-red-500 hover:text-red-700 font-medium border border-red-200 px-3 py-1 rounded-full transition">데이터 초기화</button>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8">
        <div class="mb-8">
            <h2 class="text-3xl font-bold mb-2">김진숙 포트폴리오 관리</h2>
            <p class="text-gray-600">카테고리별로 최근 디자인 순서대 올라가 있습니다!.</p>
        </div>

        <div id="category-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Cards will be injected by JavaScript -->
        </div>
    </main>

    <div id="image-modal" class="fixed inset-0 bg-black bg-opacity-80 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-4xl max-h-[90vh] overflow-hidden flex flex-col shadow-2xl">
            <div class="p-4 border-b flex justify-between items-center bg-gray-50">
                <h3 id="modal-title" class="font-bold text-lg">상세 보기</h3>
                <button onclick="closeModal()" class="text-gray-500 hover:text-black font-semibold">닫기</button>
            </div>
            <div id="modal-gallery" class="p-4 overflow-y-auto flex flex-col gap-4">
                <!-- Modal content -->
            </div>
        </div>
    </div>

    <script>
        const CATEGORIES = ['상세페이지', '패키지', '프로모션 디자인', 'AI목업', '기타'];
        
        // 데이터 로드 및 초기화
        let portfolioData = JSON.parse(localStorage.getItem('portfolioData'));
        
        // 데이터가 없거나 형식이 잘못된 경우 초기화
        if (!portfolioData || typeof portfolioData !== 'object' || Array.isArray(portfolioData)) {
            portfolioData = {};
            CATEGORIES.forEach(cat => portfolioData[cat] = []);
            localStorage.setItem('portfolioData', JSON.stringify(portfolioData));
        }

        function saveToStorage() {
            localStorage.setItem('portfolioData', JSON.stringify(portfolioData));
            renderDashboard();
        }

        // 이미지 리사이징 (Base64 처리)
        async function resizeImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 800;
                        const scale = Math.min(MAX_WIDTH / img.width, 1);
                        canvas.width = img.width * scale;
                        canvas.height = img.height * scale;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', 0.8));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        function renderDashboard() {
            const container = document.getElementById('category-container');
            container.innerHTML = '';

            CATEGORIES.forEach(cat => {
                const images = portfolioData[cat] || [];
                const card = document.createElement('div');
                card.className = 'bg-white p-6 rounded-2xl shadow-sm border border-gray-100 portfolio-card flex flex-col';
                
                // Upload button updated with style="background-color: #7719aa;"
                card.innerHTML = `
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="font-bold text-lg text-gray-800">${cat} <span class="text-gray-400 font-normal">(${images.length})</span></h3>
                        <input type="file" id="file-${cat}" class="hidden" accept="image/*" onchange="handleUpload('${cat}', this.files[0])">
                        <label for="file-${cat}" style="background-color: #7719aa;" class="cursor-pointer text-white text-xs px-4 py-2 rounded-full hover:opacity-90 transition shadow-sm font-semibold">업로드</label>
                    </div>
                    <div class="flex-1 overflow-y-auto space-y-3 pr-2 hide-scrollbar border-t pt-4" onclick="openModal('${cat}')">
                        ${images.length === 0 
                            ? '<div class="h-full flex items-center justify-center text-gray-400 text-sm italic cursor-pointer hover:text-gray-600">클릭하여 이미지 보기</div>'
                            : images.map((img, idx) => `
                                <div class="relative group cursor-pointer">
                                    <img src="${img}" class="w-full rounded-lg shadow-sm hover:opacity-90 transition object-cover h-32" alt="portfolio item">
                                    <button onclick="deleteImage('${cat}', ${idx}); event.stopPropagation();" class="absolute top-2 right-2 bg-red-500 text-white p-1 rounded-full opacity-0 group-hover:opacity-100 transition shadow-md">
                                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                                    </button>
                                </div>
                            `).join('')}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function handleUpload(cat, file) {
            if (!file) return;
            const base64 = await resizeImage(file);
            if (!portfolioData[cat]) portfolioData[cat] = [];
            portfolioData[cat].push(base64);
            saveToStorage();
        }

        function deleteImage(cat, index) {
            if(confirm('이 이미지를 삭제하시겠습니까?')) {
                portfolioData[cat].splice(index, 1);
                saveToStorage();
                if(!document.getElementById('image-modal').classList.contains('hidden')) {
                    openModal(cat);
                }
            }
        }

        function clearData() {
            if(confirm('정말 모든 포트폴리오 데이터를 삭제하시겠습니까?')) {
                CATEGORIES.forEach(cat => portfolioData[cat] = []);
                saveToStorage();
            }
        }

        function openModal(cat) {
            const modal = document.getElementById('image-modal');
            const gallery = document.getElementById('modal-gallery');
            const title = document.getElementById('modal-title');
            
            title.innerText = cat;
            const images = portfolioData[cat] || [];
            
            gallery.innerHTML = images.length === 0 
                ? '<p class="text-center text-gray-500 py-10">등록된 이미지가 없습니다.</p>'
                : images.map((img, idx) => `
                    <div class="relative group">
                        <img src="${img}" class="w-full rounded-xl border border-gray-100 shadow-sm" />
                        <button onclick="deleteImage('${cat}', ${idx})" class="absolute top-4 right-4 bg-red-500/90 hover:bg-red-600 text-white px-4 py-2 rounded-full font-bold shadow-lg">
                           삭제
                        </button>
                    </div>
                `).join('');
            
            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('image-modal').classList.add('hidden');
        }

        // Initial rendering on load
        window.onload = renderDashboard;
    </script>
</body>
</html>

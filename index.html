<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹 디자이너 김진숙 포트폴리오</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #fafafa;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .portfolio-card { transition: all 0.3s ease; height: 500px; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }

        /* --- PDF 내보내기 / 인쇄 완전 최적화 CSS --- */
        @media print {
            @page {
                size: A4 portrait;
                margin: 12mm 12mm 15mm 12mm;
            }
            .no-print, header button, #full-image-modal, #image-modal {
                display: none !important;
            }
            body {
                background-color: #ffffff !important;
                color: #111827 !important;
                padding: 0 !important;
                margin: 0 !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            header {
                position: static !important;
                box-shadow: none !important;
                border-bottom: 2px solid #111827 !important;
                padding-bottom: 8px !important;
                margin-bottom: 16px !important;
            }
            main {
                max-width: 100% !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            #category-container {
                display: block !important;
            }
            .portfolio-card {
                height: auto !important;
                box-shadow: none !important;
                border: 1px solid #d1d5db !important;
                border-radius: 12px !important;
                margin-bottom: 20px !important;
                padding: 16px !important;
                page-break-inside: avoid !important;
                break-inside: avoid !important;
                background-color: #ffffff !important;
            }
            .portfolio-card > div:first-child {
                border-bottom: 2px solid #7719aa !important;
                padding-bottom: 6px !important;
                margin-bottom: 12px !important;
            }
            .overflow-y-auto {
                overflow: visible !important;
                max-height: none !important;
            }
            /* 세로로 긴 상세페이지 이미지가 인쇄 레이아웃을 뚫는 현상 방지 */
            .portfolio-card img {
                max-height: 200px !important;
                width: 100% !important;
                object-fit: cover !important;
                object-position: top !important;
                border-radius: 6px !important;
                border: 1px solid #e5e7eb !important;
            }
            .portfolio-card .flex-1.overflow-y-auto {
                display: grid !important;
                grid-template-columns: repeat(2, 1fr) !important;
                gap: 12px !important;
            }
            .portfolio-card .border {
                border: 1px solid #e5e7eb !important;
                padding: 10px !important;
                border-radius: 8px !important;
                page-break-inside: avoid !important;
                break-inside: avoid !important;
                background-color: #f9fafb !important;
            }
            ::-webkit-scrollbar {
                display: none !important;
            }
        }
    </style>
</head>
<body class="text-gray-900 min-h-screen flex flex-col">

    <header class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-tight">KIM JIN SOOK PORTFOLIO</h1>
            <button onclick="window.print()" class="px-3.5 py-1.5 bg-[#7719aa] text-white rounded-lg text-sm font-semibold shadow-sm hover:opacity-90 transition flex items-center gap-1.5 no-print">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                PDF 내보내기
            </button>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8 flex-1 w-full">
        <div class="mb-8">
            <h2 class="text-3xl font-bold mb-2" style="letter-spacing: 0px;">22년 차 실전형 디자이너 김진숙</h2>
            <div class="text-[#282828]">
                <p style="color: #282828; line-height: 1.6;">"단순히 아름다운 디자인을 넘어 타겟과 시장을 분석해 브랜드를 기획합니다. 20년 이상의 현장 경험이 증명하는 확실한 실전형 디자이너입니다."</p>
                <p style="color: #282828; line-height: 1.6; margin-top: 8px;">"어떤 협업 환경에서도 유연하게 소통하며, 주도적인 책임감으로 프로젝트를 성공적으로 이끄는 신뢰의 결과물을 보여드리겠습니다."</p>
            </div>
        </div>

        <div id="category-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- 자바스크립트를 통해 렌더링됩니다 -->
        </div>
    </main>

    <!-- 카테고리별 전체 모달 -->
    <div id="image-modal" class="fixed inset-0 bg-black bg-opacity-80 z-40 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-4xl max-h-[90vh] flex flex-col shadow-2xl">
            <div class="p-4 border-b flex justify-between items-center bg-gray-50 rounded-t-2xl shrink-0">
                <h3 id="modal-title" class="font-bold text-lg">상세 보기</h3>
                <button onclick="closeModal()" class="text-gray-500 hover:text-black font-semibold">닫기</button>
            </div>
            <div id="modal-gallery" class="p-6 overflow-y-auto custom-scrollbar flex-1 flex flex-col gap-8 bg-gray-100">
                <!-- 갤러리 내용이 여기에 들어갑니다 -->
            </div>
        </div>
    </div>

    <!-- PC 및 모바일 최적화 원본/확대 모달 -->
    <div id="full-image-modal" class="fixed inset-0 bg-black/95 z-[60] hidden flex flex-col items-center justify-between select-none">
        <!-- 상단 고정 조작바 -->
        <div class="w-full p-3 sm:p-4 flex justify-between items-center z-10 bg-gradient-to-b from-black/90 via-black/50 to-transparent shrink-0">
            <div class="flex items-center gap-1 sm:gap-2 text-white text-xs sm:text-sm bg-black/60 backdrop-blur-md px-3 py-1.5 rounded-full border border-white/20 shadow-xl">
                <button onclick="zoomOutImage()" class="px-2.5 py-1 hover:bg-white/20 active:bg-white/30 rounded font-bold transition text-base" title="축소">-</button>
                <span id="zoom-level-text" class="px-1.5 min-w-[65px] text-center font-semibold text-gray-200">화면맞춤</span>
                <button onclick="zoomInImage()" class="px-2.5 py-1 hover:bg-white/20 active:bg-white/30 rounded font-bold transition text-base" title="확대">+</button>
                <div class="w-[1px] h-4 bg-white/30 mx-0.5"></div>
                <button onclick="setZoomImage(1.0)" class="px-2 py-1 hover:bg-white/20 active:bg-white/30 rounded text-xs transition">100%</button>
                <button onclick="resetZoomImage()" class="px-2 py-1 bg-white/20 hover:bg-white/30 active:bg-white/40 rounded text-xs transition font-medium">맞춤</button>
            </div>
            <button onclick="closeFullImage()" class="text-white text-2xl font-bold bg-black/70 hover:bg-black rounded-full w-10 h-10 flex items-center justify-center transition border border-white/20 shadow-xl">&times;</button>
        </div>

        <!-- 이미지 컨테이너 -->
        <div id="full-img-container" class="w-full flex-1 overflow-auto custom-scrollbar flex items-center justify-center p-2 sm:p-6">
            <img id="full-size-img" src="" class="max-w-full max-h-[85vh] w-auto h-auto object-contain rounded-lg shadow-2xl transition-all duration-200 ease-out cursor-zoom-in my-auto block" onclick="toggleZoomImage(event)">
        </div>
        
        <!-- 하단 안내 문구 -->
        <div class="p-2 sm:p-3 text-white/70 text-xs text-center z-10 bg-gradient-to-t from-black/90 via-black/50 to-transparent w-full shrink-0">
            💡 이미지 클릭/터치, 상단 버튼, 또는 PC 마우스 휠로 자유롭게 확대/축소할 수 있습니다. (Esc: 닫기)
        </div>
    </div>

    <script>
        const CATEGORIES = ['상세페이지', '패키지', '프로모션 디자인', 'AI목업', '기타'];
        
        let portfolioData = {
            '상세페이지': [
                { image: './images/work12.jpg', title: '과일 가득 담은 꿀 3종 상세페이지', topic: '과일 가득 담은 꿀 3종 상세페이지 (상세디자인)', year: '2026년', duration: '1일' },
                { image: './images/work11.jpg', title: '보루네오 편백나무침대 신제품 상세페이지', topic: '보루네오 편백나무침대 신제품 상세페이지 (상세디자인)', year: '2025년', duration: '3~5일' },
                { image: './images/work10.jpg', title: '보루네오 소파 2인용 신제품 상세페이지', topic: '보루네오 소파 2인용 신제품 상세페이지 (상세디자인)', year: '2025년', duration: '3~5일' },
                { image: './images/work9.jpg', title: '보태니컬 샴푸 상세페이지', topic: '일본어, 한국어 2가지 버전 (촬영, 기획, 상세디자인)', year: '2024년', duration: '3~5일' }
            ],
            '프로모션 디자인': [
                { image: './images/work1.jpg', title: '스마트스토어 모바일페이지', topic: '안전망 사다리', year: '2026년', duration: '2일' },
                { image: './images/work2.jpg', title: '스토어 모바일배너', topic: '대문자바라', year: '2026년', duration: '1일' },
                { image: './images/work3.jpg', title: '네이버_행사배너', topic: '가구_네이버', year: '2025년', duration: '2025년' },
                { image: './images/work8.jpg', title: 'Hella 스마트스토어 모바일배너 외', topic: 'Hella 스마트스토어 모바일배너 외', year: '2022년', duration: '0일' }
            ],
            '패키지': [
                { image: './images/work5.jpg', title: '과일 가득 담은 꿀 단상자 패키지', topic: '50대이상 오프라인 (매장용)', year: '2026년 7월', duration: '2일' },
                { image: './images/work6.jpg', title: '본헤나 보태니컬/티트리 샴푸 단상자 패키지', topic: '전체사용 (일본 매장용)', year: '2024년 2월', duration: '1일' },
                { image: './images/work7.jpg', title: '엔진오일 / 연료첨가제 / 수분제거제 단상자 패키지', topic: '엔진오일첨가제, 연료첨가제, 수분제거제 (자동차 관리용)', year: '2020년', duration: '0일' }
            ],
            'AI목업': [
                { image: './images/work4.jpg', title: '과일 가득 담은 꿀 선물세트 AI 목업', topic: '과일 가득 담은 꿀 패키지 AI 렌더링', year: '2026년', duration: '1시간' }
            ]
        };

        CATEGORIES.forEach(cat => {
            if (!portfolioData[cat]) portfolioData[cat] = [];
        });

        // 작업년도/월 내림차순(최신순) 정렬 계산 함수
        function getYearScore(item) {
            const text = `${item.year || ''} ${item.topic || ''} ${item.duration || ''} ${item.title || ''}`;
            const yearMatch = text.match(/(20\d{2})/);
            let year = yearMatch ? parseInt(yearMatch[1]) : 0;
            
            let month = 0;
            const monthMatch = text.match(/(20\d{2})\s*년?\s*(\d{1,2})\s*월?/);
            if (monthMatch) {
                month = parseInt(monthMatch[2]);
            }
            
            return year * 100 + month;
        }

        function renderDashboard() {
            const container = document.getElementById('category-container');
            container.innerHTML = '';
            
            CATEGORIES.forEach(cat => {
                const items = (portfolioData[cat] || []).sort((a, b) => getYearScore(b) - getYearScore(a));

                const card = document.createElement('div');
                card.className = 'bg-white p-5 rounded-2xl shadow-sm border border-gray-200 portfolio-card flex flex-col';
                
                card.innerHTML = `
                    <div class="flex justify-between items-center mb-4 border-b pb-3">
                        <h3 class="font-bold text-lg">${cat} <span class="text-gray-400 font-normal">(${items.length})</span></h3>
                    </div>
                    <div class="flex-1 overflow-y-auto space-y-3 pr-2 custom-scrollbar">
                        ${items.length === 0 ? `<div class="h-full flex items-center justify-center text-gray-400 text-sm">등록된 이미지가 없습니다.</div>` : ''}
                        ${items.map((item) => `
                            <div class="border rounded-xl p-3 hover:bg-gray-50 transition group bg-white shadow-sm relative">
                                <div class="max-h-48 overflow-y-auto custom-scrollbar rounded-lg border border-gray-100 mb-2 bg-gray-50 cursor-pointer relative" onclick="openModal('${cat}')">
                                    <div class="absolute inset-0 bg-black bg-opacity-0 group-hover:bg-opacity-10 transition z-10 flex items-center justify-center no-print">
                                        <span class="text-white opacity-0 group-hover:opacity-100 drop-shadow-md font-bold text-sm bg-black bg-opacity-50 px-3 py-1 rounded-full">자세히 보기</span>
                                    </div>
                                    <img src="${item.image}" class="w-full h-auto block relative z-0" onerror="this.src='https://via.placeholder.com/300x200?text=Image+Not+Found'">
                                </div>
                                <div class="px-1">
                                    <div class="text-sm font-bold truncate text-gray-800">${item.title || '제목 없음'}</div>
                                    <div class="text-xs text-gray-500 mt-1">${item.topic || '주제 미상'} ${item.year ? '| ' + item.year : ''} | ${item.duration || '기간 미상'}</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function openModal(cat) {
            const modal = document.getElementById('image-modal');
            const gallery = document.getElementById('modal-gallery');
            document.getElementById('modal-title').innerText = cat;
            const items = portfolioData[cat] || [];
            
            if(items.length === 0) {
                gallery.innerHTML = '<div class="text-center text-gray-500 py-10">등록된 이미지가 없습니다.</div>';
            } else {
                gallery.innerHTML = items.map((item) => `
                    <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-200 flex flex-col md:flex-row gap-6 items-start">
                        <div class="w-full md:w-1/2 max-h-[500px] overflow-y-auto custom-scrollbar rounded-xl border border-gray-200 bg-gray-50 cursor-pointer relative group shrink-0" onclick="openFullImage(event, '${item.image}')">
                            <div class="absolute inset-0 bg-black bg-opacity-0 group-hover:bg-opacity-10 transition z-10 flex items-center justify-center">
                                <span class="text-white opacity-0 group-hover:opacity-100 drop-shadow-md font-bold text-lg bg-black bg-opacity-60 px-4 py-2 rounded-full">원본 크기로 보기</span>
                            </div>
                            <img src="${item.image}" class="w-full h-auto block relative z-0" onerror="this.src='https://via.placeholder.com/300x200?text=Image+Not+Found'" />
                        </div>
                        <div class="w-full md:w-1/2">
                            <h4 class="text-2xl font-bold mb-4 text-gray-800 pb-2 border-b">${item.title}</h4>
                            <div class="space-y-3">
                                <p class="text-gray-700 flex items-center"><span class="w-20 font-semibold text-gray-500">주제</span> ${item.topic}</p>
                                <p class="text-gray-700 flex items-center"><span class="w-20 font-semibold text-gray-500">작업년도</span> ${item.year || '-'}</p>
                                <p class="text-gray-700 flex items-center"><span class="w-20 font-semibold text-gray-500">제작기간</span> ${item.duration}</p>
                            </div>
                        </div>
                    </div>
                `).join('');
            }
            modal.classList.remove('hidden');
        }

        function closeModal() { document.getElementById('image-modal').classList.add('hidden'); }

        /* --- PC & 모바일 반응형 확대/축소 핵심 최적화 로직 --- */
        let currentZoom = 1;
        const MIN_ZOOM = 0.5;
        const MAX_ZOOM = 3.0;
        const ZOOM_STEP = 0.25;

        function openFullImage(event, imageSrc) {
            if (event) event.stopPropagation(); 
            const img = document.getElementById('full-size-img');
            img.src = imageSrc;
            currentZoom = 1;
            applyZoom();
            
            const container = document.getElementById('full-img-container');
            container.scrollTop = 0;
            container.scrollLeft = 0;

            document.getElementById('full-image-modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeFullImage() {
            document.getElementById('full-image-modal').classList.add('hidden');
            document.getElementById('full-size-img').src = '';
            document.body.style.overflow = '';
        }

        function applyZoom() {
            const img = document.getElementById('full-size-img');
            const zoomText = document.getElementById('zoom-level-text');
            const container = document.getElementById('full-img-container');

            if (currentZoom === 1) {
                img.style.transform = 'none';
                img.style.transformOrigin = 'center center';
                img.className = 'max-w-full max-h-[85vh] w-auto h-auto object-contain rounded-lg shadow-2xl transition-all duration-200 ease-out cursor-zoom-in my-auto mx-auto block';
                container.className = 'w-full flex-1 overflow-auto custom-scrollbar flex items-center justify-center p-2 sm:p-6';
                zoomText.innerText = '화면맞춤';
            } else {
                img.style.transform = `scale(${currentZoom})`;
                img.style.transformOrigin = 'top center';
                img.className = 'transition-transform duration-200 ease-out rounded-lg shadow-2xl cursor-zoom-out my-8 mx-auto block max-w-none';
                container.className = 'w-full flex-1 overflow-auto custom-scrollbar block p-4 sm:p-8 text-center';
                zoomText.innerText = `${Math.round(currentZoom * 100)}%`;
            }
        }

        function zoomInImage() {
            if (currentZoom < MAX_ZOOM) {
                currentZoom = Math.min(MAX_ZOOM, currentZoom + ZOOM_STEP);
                applyZoom();
            }
        }

        function zoomOutImage() {
            if (currentZoom > MIN_ZOOM) {
                currentZoom = Math.max(MIN_ZOOM, currentZoom - ZOOM_STEP);
                applyZoom();
            }
        }

        function setZoomImage(zoomValue) {
            currentZoom = zoomValue;
            applyZoom();
        }

        function resetZoomImage() {
            currentZoom = 1;
            applyZoom();
        }

        function toggleZoomImage(event) {
            event.stopPropagation();
            if (currentZoom === 1) {
                currentZoom = 1.75;
            } else {
                currentZoom = 1;
            }
            applyZoom();
        }

        document.getElementById('full-img-container').addEventListener('wheel', function(e) {
            const fullModal = document.getElementById('full-image-modal');
            if (fullModal.classList.contains('hidden')) return;
            
            e.preventDefault();
            if (e.deltaY < 0) {
                zoomInImage();
            } else {
                zoomOutImage();
            }
        }, { passive: false });

        window.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                const fullModal = document.getElementById('full-image-modal');
                if (!fullModal.classList.contains('hidden')) {
                    closeFullImage();
                } else {
                    closeModal();
                }
            }
        });

        window.onload = renderDashboard;
    </script>
</body>
</html>
